<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anish 11+">
<link rel="apple-touch-icon" href="/static/icon.png">
<link rel="apple-touch-icon-precomposed" href="/static/icon.png">
<link rel="icon" type="image/png" href="/static/icon.png">
<title>{% block title %}Anish's 11+ App{% endblock %}</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --maths:#6C63FF;
  --english:#00C896;
  --verbal:#FF6B6B;
  --bg:#0A0A1A;
  --surface:#12122A;
  --card:#1A1A35;
  --border:#2A2A4A;
  --text:#FFFFFF;
  --muted:rgba(255,255,255,0.5);
  --radius:20px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 20%,rgba(108,99,255,0.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,200,150,0.1) 0%,transparent 50%);pointer-events:none;z-index:0;}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,26,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--maths),#A78BFA);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.logo-text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:700;font-size:18px;color:white;}
.logo-sub{font-size:11px;color:var(--muted);font-weight:600;}

/* NAV */
.nav{display:flex;justify-content:center;gap:6px;padding:12px 16px;flex-wrap:wrap;}
.nav a{color:var(--muted);text-decoration:none;padding:8px 18px;border-radius:50px;font-size:13px;font-weight:700;border:1.5px solid transparent;transition:all 0.2s;}
.nav a:hover,.nav a.active{background:rgba(255,255,255,0.1);color:white;border-color:var(--border);}
.nav a.active{background:linear-gradient(135deg,rgba(108,99,255,0.3),rgba(167,139,250,0.2));border-color:var(--maths);}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:24px 16px 80px;position:relative;z-index:1;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;}
.card-glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
.mini{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr);}}
.stat{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;}
.stat .n{font-size:28px;font-weight:900;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;}

/* SUBJECT CARDS */
.sub-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px;}
@media(max-width:600px){.sub-grid{grid-template-columns:1fr;}}
.sub-card{border-radius:24px;padding:32px 20px;text-align:center;color:white;text-decoration:none;transition:all 0.3s;position:relative;overflow:hidden;}
.sub-card::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 60%);pointer-events:none;}
.sub-card:hover{transform:translateY(-8px) scale(1.02);}
.sub-card .e{font-size:52px;margin-bottom:12px;display:block;}
.sub-card .n{font-size:18px;font-weight:900;margin-bottom:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.sub-card .c{font-size:12px;opacity:0.8;line-height:1.6;}

/* TOPIC ROWS */
.topic{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;color:var(--text);text-decoration:none;border-left:4px solid var(--border);transition:all 0.2s;}
.topic:hover{transform:translateX(4px);border-color:var(--maths);background:rgba(108,99,255,0.1);}
.t-num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:white;flex-shrink:0;}
.t-body{flex:1;}
.t-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
.t-title{font-size:14px;font-weight:800;margin-top:2px;}
.t-meta{margin-top:4px;display:flex;gap:5px;flex-wrap:wrap;}

/* BADGES */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;}
.b-new{background:rgba(108,99,255,0.2);color:#A78BFA;}
.b-great{background:rgba(0,200,150,0.2);color:#00C896;}
.b-ok{background:rgba(251,191,36,0.2);color:#FBB724;}
.b-struggled{background:rgba(255,107,107,0.2);color:#FF6B6B;}
.b-mastered{background:rgba(0,200,150,0.2);color:#00C896;}
.b-s0{background:rgba(108,99,255,0.2);color:#A78BFA;}
.b-s1{background:rgba(59,130,246,0.2);color:#60A5FA;}
.b-s2{background:rgba(251,191,36,0.2);color:#FBB724;}
.b-s3{background:rgba(236,72,153,0.2);color:#F472B6;}
.b-s4{background:rgba(0,200,150,0.2);color:#00C896;}
.b-overdue{background:rgba(255,107,107,0.2);color:#FF6B6B;}

/* BUTTONS */
.btn{display:inline-block;padding:12px 24px;border-radius:50px;border:none;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;text-align:center;transition:all 0.2s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.btn:hover{transform:translateY(-2px);}
.btn-p{background:linear-gradient(135deg,#6C63FF,#A78BFA);color:white;box-shadow:0 4px 20px rgba(108,99,255,0.4);}
.btn-g{background:linear-gradient(135deg,#00C896,#00E5AB);color:#0A2E24;box-shadow:0 4px 20px rgba(0,200,150,0.4);}
.btn-o{background:linear-gradient(135deg,#F59E0B,#FBB724);color:#1A0A00;}
.btn-r{background:linear-gradient(135deg,#FF6B6B,#FF8E8E);color:white;}
.btn-w{background:rgba(255,255,255,0.1);color:white;border:1.5px solid var(--border);}
.btn-block{display:block;width:100%;}
.btn-lg{padding:18px 40px;font-size:18px;}
.btn-sm{padding:8px 16px;font-size:13px;}

/* LESSON STYLES */
.lesson-block{border-radius:14px;padding:18px;margin:14px 0;}
.lesson-block h3{font-size:15px;font-weight:900;margin-bottom:10px;}
.lesson-block.definition{background:rgba(108,99,255,0.1);border-left:4px solid var(--maths);}
.lesson-block.definition h3{color:#A78BFA;}
.lesson-block.worked{background:rgba(0,200,150,0.1);border-left:4px solid var(--english);}
.lesson-block.worked h3{color:#00C896;}
.lesson-block.tip{background:rgba(251,191,36,0.1);border-left:4px solid #FBB724;}
.lesson-block.tip h3{color:#FBB724;}
.lesson-block.mistake{background:rgba(255,107,107,0.1);border-left:4px solid var(--verbal);}
.lesson-block.mistake h3{color:#FF6B6B;}
.lesson-block p{font-size:14px;line-height:1.8;margin-bottom:8px;color:rgba(255,255,255,0.85);}
.lesson-block ul,.lesson-block ol{padding-left:20px;margin:8px 0;}
.lesson-block li{font-size:14px;line-height:1.9;color:rgba(255,255,255,0.85);}
.lesson-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0;}
.lesson-table th{background:rgba(108,99,255,0.3);color:white;padding:10px;text-align:left;font-weight:800;}
.lesson-table td{padding:10px;border-bottom:1px solid var(--border);color:rgba(255,255,255,0.85);}
.lesson-table tr:nth-child(even) td{background:rgba(255,255,255,0.03);}
.rule-box{background:linear-gradient(135deg,rgba(108,99,255,0.2),rgba(167,139,250,0.1));border:1px solid rgba(108,99,255,0.4);border-radius:12px;padding:16px;margin:12px 0;}
.rule-box p{color:white;font-size:14px;line-height:2;font-weight:700;}
.worked-calc{background:#0D0D1F;border:1px solid var(--border);border-radius:10px;padding:14px;margin:10px 0;}
.worked-calc pre{color:#00C896;font-family:'Courier New',monospace;font-size:13px;white-space:pre-wrap;}
.number-line{background:rgba(108,99,255,0.1);border:1px solid rgba(108,99,255,0.3);border-radius:8px;padding:10px 14px;font-family:'Courier New';font-size:14px;text-align:center;margin:8px 0;color:#A78BFA;}
.fraction-diagram{background:rgba(255,255,255,0.05);border-radius:8px;padding:12px;margin:8px 0;}

/* QUIZ */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px;color:var(--text);}
.q-text{font-size:18px;font-weight:800;line-height:1.6;margin-bottom:20px;color:white;}
.opt{width:100%;padding:14px 18px;margin:8px 0;border-radius:14px;border:2px solid var(--border);background:rgba(255,255,255,0.03);font-size:15px;font-weight:700;cursor:pointer;text-align:left;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:all 0.2s;display:flex;align-items:center;gap:12px;color:white;}
.opt:hover{border-color:var(--maths);background:rgba(108,99,255,0.1);transform:translateX(4px);}
.opt.sel{border-color:var(--maths);background:rgba(108,99,255,0.2);}
.opt .ltr{width:32px;height:32px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;color:white;}
.opt.sel .ltr{background:var(--maths);}
.opt.right{border-color:var(--english);background:rgba(0,200,150,0.1);}
.opt.right .ltr{background:var(--english);color:#0A2E24;}
.opt.wrong{border-color:var(--verbal);background:rgba(255,107,107,0.1);}
.opt.wrong .ltr{background:var(--verbal);}
.type-in{width:100%;padding:14px 18px;border-radius:14px;border:2px solid var(--border);font-size:16px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:rgba(255,255,255,0.05);color:white;}
.type-in:focus{outline:none;border-color:var(--maths);}
.type-in::placeholder{color:var(--muted);}

/* PROGRESS BAR */
.prog-wrap{background:rgba(255,255,255,0.1);border-radius:50px;height:10px;overflow:hidden;}
.prog-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--maths),#A78BFA);transition:width 0.4s;}

/* RESULT */
.result-circle{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;}
.result-circle .big{font-size:44px;font-weight:900;color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
.result-circle .sm{font-size:14px;color:rgba(255,255,255,0.8);font-weight:700;}
.r-item{padding:16px;border-radius:14px;margin:8px 0;border-left:4px solid var(--border);background:var(--card);color:var(--text);border:1px solid var(--border);}
.r-item.ok{background:rgba(0,200,150,0.1);border-color:var(--english);border-left-color:var(--english);}
.r-item.no{background:rgba(255,107,107,0.1);border-color:var(--verbal);border-left-color:var(--verbal);}

.sec-hdr{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:24px 0 10px;padding:0 4px;}
.empty{text-align:center;padding:60px 40px;color:var(--muted);}
.empty .e{font-size:60px;margin-bottom:12px;}
a{text-decoration:none;color:inherit;}

/* INTERACTIVE WIDGET */
.interactive-box{background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.25);border-radius:20px;padding:24px;margin:20px 0;}
.interactive-box h3{font-size:16px;font-weight:900;color:#A78BFA;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.interact-btn{background:rgba(108,99,255,0.2);border:1.5px solid rgba(108,99,255,0.4);color:white;padding:10px 20px;border-radius:50px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s;}
.interact-btn:hover{background:rgba(108,99,255,0.35);transform:scale(1.05);}
.example-card{background:rgba(0,200,150,0.08);border:1px solid rgba(0,200,150,0.2);border-radius:14px;padding:16px;margin:10px 0;}
.example-card p{font-size:14px;line-height:1.8;color:rgba(255,255,255,0.9);}
.example-card strong{color:#00C896;}
</style>
</head>
<body>
{% if parent_mode %}<div style="background:linear-gradient(90deg,#6C63FF,#A78BFA);text-align:center;padding:10px;font-size:13px;font-weight:800;">👀 PARENT VIEW — Read Only</div>{% endif %}
<div class="topbar">
  <a href="/" class="logo">
    <div class="logo-icon">⭐</div>
    <div><div class="logo-text">Anish's 11+ App</div><div class="logo-sub">Grammar School Prep</div></div>
  </a>
</div>
<div class="nav">
  <a href="/" class="{% if request.path=='/' %}active{% endif %}">🏠 Home</a>
  <a href="/subject/Maths" class="{% if 'Maths' in request.path %}active{% endif %}">🔢 Maths</a>
  <a href="/subject/English" class="{% if 'English' in request.path %}active{% endif %}">📚 English</a>
  <a href="/subject/Verbal Reasoning" class="{% if 'Reasoning' in request.path %}active{% endif %}">🧠 Verbal</a>
  <a href="/subject/Previous Exam Questions" class="{% if 'Previous Exam' in request.path %}active{% endif %}">🗂️ Past Papers</a>
  <a href="/progress" class="{% if request.path=='/progress' %}active{% endif %}">📊 Progress</a>
</div>
<div class="main">{% block content %}{% endblock %}</div>
</body>
</html>
